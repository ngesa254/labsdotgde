<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" role="img" aria-labelledby="title desc">
 <title id="title">Code, teach, play — the labsdotgde blueprint</title>
 <desc id="desc">A technical drawing of a terminal with commands for shipping code, teaching community labs, and experimenting with ideas. Start. Build. Grow.</desc>
 <defs><marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 8 2" fill="none" stroke="#e07a2f" stroke-width="1.4"/></marker></defs>
