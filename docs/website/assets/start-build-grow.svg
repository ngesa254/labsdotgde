 <text x="280" y="110" text-anchor="middle" fill="#a9bed7" font-family="'IBM Plex Mono',monospace" font-size="13">~/labsdotgde</text>
 <g fill="#e8f0f8" font-family="'IBM Plex Mono',monospace" font-size="17">
  <text x="105" y="161">$ git push --ship-it</text>
  <text x="105" y="225">$ teach --labs --community</text>
  <text x="105" y="289">$ play --ideas --repeat</text>
  <text x="105" y="338" fill="#e07a2f">$</text>
