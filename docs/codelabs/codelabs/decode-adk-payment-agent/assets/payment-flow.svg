<svg xmlns="http://www.w3.org/2000/svg" width="900" height="758" viewBox="0 0 900 758" role="img" aria-labelledby="title"><title id="title">Preparation is not payment confirmation</title><rect width="900" height="758" rx="20" fill="#f3f7f5"/><style>text{font-family:Arial,sans-serif;fill:#16362c}.title{font-size:25px;font-weight:bold}.label{font-size:21px;font-weight:bold}.detail{font-size:18px}</style><text x="32" y="47" class="title">Preparation is not payment confirmation</text><rect x="32" y="78" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="107" class="label">1. Core: validate input → prepared_only</text><text x="52" y="134" class="detail">In-process; illustrative payload returned; no credentials or network needed.</text><path d="M450 158 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="186" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="215" class="label">2. Optional: operator enables sandbox initiation</text><text x="52" y="242" class="detail">Code gate; fixed sandbox host; server controls shortcode and callback.</text><path d="M450 266 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="294" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="323" class="label">3. MCP server → Daraja OAuth endpoint</text><text x="52" y="350" class="detail">HTTPS GET with app key + secret (Basic); token remains server-private.</text><path d="M450 374 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="402" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="431" class="label">4. MCP server → Daraja STK endpoint</text><text x="52" y="458" class="detail">HTTPS POST once; ResponseCode 0 = accepted for processing only.</text><path d="M450 482 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="510" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="539" class="label">5. Daraja → merchant callback (not implemented here)</text><text x="52" y="566" class="detail">Future HTTPS receiver must establish provenance, correlation and amount.</text><path d="M450 590 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="618" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="647" class="label">6. Unknown outcome → reconcile before resubmitting</text><text x="52" y="674" class="detail">No automatic retry, durable idempotency, callback receiver or status query.</text></svg>