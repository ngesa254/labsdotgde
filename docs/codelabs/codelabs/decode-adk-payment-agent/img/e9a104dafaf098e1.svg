<svg xmlns="http://www.w3.org/2000/svg" width="900" height="758" viewBox="0 0 900 758" role="img" aria-labelledby="title"><title id="title">One bounded ADK turn: who does what?</title><rect width="900" height="758" rx="20" fill="#f3f7f5"/><style>text{font-family:Arial,sans-serif;fill:#16362c}.title{font-size:25px;font-weight:bold}.label{font-size:21px;font-weight:bold}.detail{font-size:18px}</style><text x="32" y="47" class="title">One bounded ADK turn: who does what?</text><rect x="32" y="78" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="107" class="label">1. Caller → Cloud Run /chat</text><text x="52" y="134" class="detail">HTTPS + caller ID token; IAM authorization happens before the app.</text><path d="M450 158 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="186" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="215" class="label">2. app.py → runtime identity provider</text><text x="52" y="242" class="detail">Obtain MCP-audience ID token at turn start, not module import.</text><path d="M450 266 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="294" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="323" class="label">3. app.py → Runner → Gemini</text><text x="52" y="350" class="detail">In-process orchestration, then network model inference with runtime ADC.</text><path d="M450 374 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="402" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="431" class="label">4. MCPToolset → FastMCP /mcp</text><text x="52" y="458" class="detail">Network initialize → tools/list → tools/call; IAM checks agent identity.</text><path d="M450 482 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="510" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="539" class="label">5. FastMCP → domain tool → MCPToolset → Gemini</text><text x="52" y="566" class="detail">Local execution, network result, then model inference for the reply.</text><path d="M450 590 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="618" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="647" class="label">6. app.py → caller; close transports</text><text x="52" y="674" class="detail">Return text; close toolset in same task; delete process-local session.</text></svg>