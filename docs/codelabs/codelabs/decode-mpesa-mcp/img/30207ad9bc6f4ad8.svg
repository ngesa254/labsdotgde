<svg xmlns="http://www.w3.org/2000/svg" width="900" height="758" viewBox="0 0 900 758" role="img" aria-labelledby="title"><title id="title">Two labs: reasoning, tools and trust boundaries</title><rect width="900" height="758" rx="20" fill="#f3f7f5"/><style>text{font-family:Arial,sans-serif;fill:#16362c}.title{font-size:25px;font-weight:bold}.label{font-size:21px;font-weight:bold}.detail{font-size:18px}</style><text x="32" y="47" class="title">Two labs: reasoning, tools and trust boundaries</text><rect x="32" y="78" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="107" class="label">1. Developer / Gemini CLI → private MCP, or developer → private ADK</text><text x="52" y="134" class="detail">HTTPS + Google ID token; each Cloud Run service checks IAM invoker.</text><path d="M450 158 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="186" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="215" class="label">2. Lab 2: ADK Runner → Gemini on Vertex AI</text><text x="52" y="242" class="detail">Network model inference via ADC; model requests structured tool calls.</text><path d="M450 266 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="294" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="323" class="label">3. ADK → Lab 1: FastMCP /mcp</text><text x="52" y="350" class="detail">Network: Streamable HTTP + ID token, audience = MCP service origin.</text><path d="M450 374 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="402" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="431" class="label">4. FastMCP → domain.py</text><text x="52" y="458" class="detail">In-process validation, catalog prices, totals and preparation; no payment.</text><path d="M450 482 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="510" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="539" class="label">5. Optional payments.py → Daraja sandbox</text><text x="52" y="566" class="detail">Network: OAuth Basic exchange, then Bearer-authenticated STK request.</text><path d="M450 590 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="618" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="647" class="label">6. Asynchronous outcome outside the core path</text><text x="52" y="674" class="detail">No callback receiver, reconciliation database, order store or Apigee proxy.</text></svg>