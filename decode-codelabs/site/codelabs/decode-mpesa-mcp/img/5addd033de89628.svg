<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title"><title id="title">Apigee extension: design only, not deployed</title><rect width="900" height="650" rx="20" fill="#f3f7f5"/><style>text{font-family:Arial,sans-serif;fill:#16362c}.title{font-size:25px;font-weight:bold}.label{font-size:21px;font-weight:bold}.detail{font-size:18px}</style><text x="32" y="47" class="title">Apigee extension: design only, not deployed</text><rect x="32" y="78" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="107" class="label">1. Future caller → Apigee proxy</text><text x="52" y="134" class="detail">Authenticate client; authorize tools; quotas and rate policies.</text><path d="M450 158 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="186" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="215" class="label">2. Future Apigee identity → protected MCP origin</text><text x="52" y="242" class="detail">Separate trust boundary: mint Google ID token; grant service-level invoker.</text><path d="M450 266 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="294" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="323" class="label">3. Existing MCP origin → server validation</text><text x="52" y="350" class="detail">Do not confuse gateway policy with payment consent or validation.</text><path d="M450 374 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="402" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="431" class="label">4. Extension acceptance criteria</text><text x="52" y="458" class="detail">Streaming, headers, audience, denial tests, policy tests and bypass controls.</text><path d="M450 482 v22 m-7 -7 l7 7 7 -7" fill="none" stroke="#167552" stroke-width="2"/><rect x="32" y="510" width="836" height="76" rx="9" fill="white" stroke="#b7cec2"/><text x="52" y="539" class="label">5. Core path remains direct Cloud Run IAM</text><text x="52" y="566" class="detail">No proxy bundle, Apigee org, policy configuration or gateway test supplied.</text></svg>