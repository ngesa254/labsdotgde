# Publish only the static website, preserving the existing GitHub Pages site.
website-pages:
  image: alpine:3.22
  stage: deploy
  script:
    - test -s website/dist/index.html
    - test -s website/dist/codelabs/index.html
    - test -s website/dist/barista/index.html
  pages:
    publish: website/dist
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
